[project]

use_directory_urls = false

site_name = "conduit"
site_description = "An opinionated Hamilton + xarray + xarray-annotated foundation for building configurable data pipelines."
site_author = "Joe Marsh Rossney"
site_url = "https://NERC-CEH.github.io/conduit"

repo_name = "NERC-CEH/conduit"
repo_url = "https://github.com/NERC-CEH/conduit"

copyright = "Copyright &copy; 2026 The authors"

nav = [
  { "Home" = "index.md" },
  { "Concepts" = [
      "concepts/overview.md",
      "concepts/pipeline-model.md",
      "concepts/contracts.md",
      "concepts/execution.md",
  ]},
  { "Guides" = [
      "guides/install.md",
      { "Write nodes" = [
          "guides/nodes/bring-your-own-module.md",
          "guides/nodes/contracts.md",
          "guides/nodes/resampling-and-units.md",
      ]},
      { "Write configs" = [
          "guides/configs/write-a-config.md",
          "guides/configs/inline-nodes-and-fan-out.md",
      ]},
      { "Validate" = [
          "guides/validate/visualise-the-graph.md",
          "guides/validate/validate-before-running.md",
          "guides/validate/test-your-pipeline.md",
      ]},
      { "Run & scale" = [
          "guides/run/run-from-the-cli.md",
          "guides/run/drive-from-python.md",
          "guides/run/scale-up.md",
      ]},
      "guides/troubleshooting.md",
  ]},
  { "Recipes" = [
      "recipes/index.md",
      "recipes/pipeline-101.md",
      "recipes/flux-pipeline.md",
  ]},
  { "Reference" = [
      "reference/configuration.md",
      "reference/data-formats.md",
      "reference/cli.md",
      "reference/python-api.md",
      { "Modules" = [
          "reference/modules/conduit.pipeline.md",
          "reference/modules/conduit.config.md",
          "reference/modules/conduit.specs.md",
          "reference/modules/conduit.io.md",
          "reference/modules/conduit.formats.md",
          "reference/modules/conduit.checks.md",
          "reference/modules/conduit.transforms.md",
          "reference/modules/conduit.graph.md",
          "reference/modules/conduit.graph_style.md",
          "reference/modules/conduit.build.md",
          "reference/modules/conduit.nodegen.md",
          "reference/modules/conduit.contract_check.md",
          "reference/modules/conduit.wiring_check.md",
          "reference/modules/conduit.caching.md",
          "reference/modules/conduit.blocking.md",
          "reference/modules/conduit.gridded/io.md",
          "reference/modules/conduit.gridded/spatial.md",
          "reference/modules/conduit.gridded/cli.md",
      ]},
  ]},
]

# Katex
extra_javascript = [
    "_static/js/katex.js",
    "https://unpkg.com/katex@0/dist/katex.min.js",
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
    "assets/termynal.js",
]
extra_css = [
    "_static/css/marimo-codehilite.css",
    "https://unpkg.com/katex@0/dist/katex.min.css",
    "assets/termynal.css",
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"


# Extensions
# ----------
# https://zensical.org/docs/setup/extensions/

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "bash", class = "bash", format = "markdown_exec.formatter", validator = "markdown_exec.validator" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# Mkdocstrings
# ------------

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src", "recipes"]

[project.plugins.mkdocstrings.handlers.python.options]
annotations_path = "brief"
docstring_style = "numpy"
docstring_section_style = "list"
inherited_members = true
line_length = 88
merge_init_into_class = true
separate_signature = true
show_signature = true
signature_crossrefs = true
show_signature_annotations = true
show_if_no_docstring = false
show_root_full_path = true
show_root_heading = true
show_root_members_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true

# mkdocs-typer2
[project.markdown_extensions.tables]

[project.markdown_extensions."mkdocs_typer2.markdown:makeExtension"]
pretty = false
engine = "native"
